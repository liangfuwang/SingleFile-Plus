<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 420px; padding: 16px; font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #1e1f24; color: #e8e8ea; }
  h1 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
  label { display: block; font-size: 12px; color: #9aa0ab; margin: 10px 0 4px; }
  input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid #3a3d45; border-radius: 8px; background: #2a2c33; color: #e8e8ea; font-size: 13px; outline: none; }
  input[type=text]:focus { border-color: #5b8def; }
  button { width: 100%; margin-top: 14px; padding: 10px; border: none; border-radius: 8px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #3a3d45; color: #777; cursor: not-allowed; }
  #log { margin-top: 12px; max-height: 180px; overflow-y: auto; background: #141519; border-radius: 8px; padding: 10px; font: 12px/1.7 Menlo, Consolas, monospace; color: #9aa0ab; display: none; }
  #log .ok { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .hl { color: #e8e8ea; }
  .bar { height: 5px; background: #2a2c33; border-radius: 3px; margin-top: 12px; overflow: hidden; display: none; }
  .bar > div { height: 100%; width: 0; background: #2563eb; border-radius: 3px; transition: width .2s; }
  .tip { margin-top: 10px; font-size: 11px; color: #6b7078; }
</style>
</head>
<body>
  <h1><span class="dot"></span>PageVault 网页存档</h1>
  <label>页面 URL</label>
  <input type="text" id="url" placeholder="https://forum.example.com/forum.php?mod=viewthread&tid=...">
  <label>保存文件名（自动取自网页标题，可修改）</label>
  <input type="text" id="fname" placeholder="自动生成">
  <button id="go">保存为单文件 HTML</button>
  <div class="bar"><div id="barFill"></div></div>
  <div id="log"></div>
  <div class="tip">点「保存」后任务在后台运行：可以关闭弹窗、切换标签页，完成时图标角标显示 ✓，文件在「下载」文件夹里。<br>抓取方式自动判断：论坛帖等服务端渲染页面直接取 HTML；飞书、Notion、知识星球等 JS 渲染页面会在标签页里执行 JS 并自动滚动加载全文。</div>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
